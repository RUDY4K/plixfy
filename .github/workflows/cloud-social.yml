name: Plixfy Cloud Social

on:
  schedule:
    # UTC retries for the 09:30 and 19:30 Asia/Riyadh slots. The planner below
    # permits only the first 60 minutes and makes all later retries no-ops.
    - cron: "30,37,47,57 6,16 * * *"
    - cron: "7,17,27 7,17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Content slot
        required: true
        default: auto
        type: choice
        options:
          - auto
          - morning
          - evening
      dry_run:
        description: Validate without sending anything
        required: true
        default: true
        type: boolean
      force:
        description: Republish even if this slot already completed
        required: true
        default: false
        type: boolean
      platforms:
        description: Comma-separated destinations for this run
        required: true
        default: telegram,discord,x,facebook,instagram
        type: string

permissions:
  contents: read

concurrency:
  group: plixfy-cloud-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore delivery state
        id: social-state
        uses: actions/cache/restore@v6
        with:
          path: |
            scripts/.social-published.json
            .social/cloud-state.json
            .social/saudi-trends.json
          key: social-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            social-state-

      - name: Plan due social slot
        id: plan
        env:
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_SLOT" =~ ^(auto|morning|evening)$ ]]; then
              echo "Invalid workflow slot" >&2
              exit 1
            fi
            if [[ ! "$INPUT_PLATFORMS" =~ ^[a-z]+(,[a-z]+)*$ ]]; then
              echo "Invalid platform list" >&2
              exit 1
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
            echo "date=" >> "$GITHUB_OUTPUT"
            echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "force=$INPUT_FORCE" >> "$GITHUB_OUTPUT"
            echo "platforms=$INPUT_PLATFORMS" >> "$GITHUB_OUTPUT"
          else
            node scripts/social-schedule-core.mjs
          fi

      - name: Install social agent dependencies
        if: steps.plan.outputs.should_run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run social agents in dry-run mode
        if: ${{ steps.plan.outputs.should_run == 'true' && steps.plan.outputs.dry_run == 'true' }}
        env:
          SOCIAL_SLOT: ${{ steps.plan.outputs.slot }}
          SOCIAL_DATE: ${{ steps.plan.outputs.date }}
          SOCIAL_FORCE: ${{ steps.plan.outputs.force }}
          SOCIAL_PLATFORMS: ${{ steps.plan.outputs.platforms }}
        shell: bash
        run: |
          args=("--slot=${SOCIAL_SLOT}" "--dry-run")
          if [[ -n "${SOCIAL_DATE}" ]]; then
            args+=("--date=${SOCIAL_DATE}")
          fi
          if [[ "${SOCIAL_FORCE}" == "true" ]]; then
            args+=("--force")
          fi
          node scripts/cloud-social-runner.mjs "${args[@]}"

      - name: Run scout, editor, publisher, and auditor agents
        if: ${{ steps.plan.outputs.should_run == 'true' && steps.plan.outputs.dry_run != 'true' }}
        env:
          SOCIAL_SLOT: ${{ steps.plan.outputs.slot }}
          SOCIAL_DATE: ${{ steps.plan.outputs.date }}
          SOCIAL_FORCE: ${{ steps.plan.outputs.force }}
          SOCIAL_PLATFORMS: ${{ steps.plan.outputs.platforms }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        shell: bash
        run: |
          args=("--slot=${SOCIAL_SLOT}")
          if [[ -n "${SOCIAL_DATE}" ]]; then
            args+=("--date=${SOCIAL_DATE}")
          fi
          if [[ "${SOCIAL_FORCE}" == "true" ]]; then
            args+=("--force")
          fi
          node scripts/cloud-social-runner.mjs "${args[@]}"

      - name: Save delivery state
        if: ${{ always() && steps.plan.outputs.should_run == 'true' && steps.plan.outputs.dry_run != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            scripts/.social-published.json
            .social/cloud-state.json
            .social/saudi-trends.json
          key: social-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload agent reports
        if: ${{ always() && steps.plan.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: social-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: .social/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Alert admin on failure
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MESSAGE: >-
            🚨 فشل أحد وكلاء نشر Plixfy. راجع التشغيل:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/telegram-alert.mjs
