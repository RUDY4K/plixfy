name: Daily social content

on:
  schedule:
    # 15:00 UTC = 18:00 بتوقيت الرياض — قبل ذروة التفاعل المسائية (20:00-23:00)
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate posts + backlink drafts and send to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/daily-social.mjs
