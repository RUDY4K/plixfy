name: Plixfy Content Drafts

on:
  schedule:
    - cron: "5 * * * *"
    - cron: "15 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plixfy-content-engine
  cancel-in-progress: false

jobs:
  prepare-drafts:
    if: github.event_name == 'workflow_dispatch' || vars.CONTENT_AI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore pending draft queue
        uses: actions/cache/restore@v6
        with:
          path: content-drafts
          key: content-drafts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: content-drafts-
      - name: Validate draft boundary
        run: node --test scripts/content-engine.test.mjs scripts/content-draft-store.test.mjs
      - name: Prepare news drafts for review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-news.mjs
      - name: Prepare weekly blog draft for review
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 6 * * 0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-blog.mjs
      - name: Verify published files are unchanged
        if: always()
        run: git diff --exit-code -- src public
      - name: Preserve pending drafts as review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pending-content-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: content-drafts/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain queue for the next draft run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: content-drafts
          key: content-drafts-${{ github.run_id }}-${{ github.run_attempt }}
