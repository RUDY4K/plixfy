name: Update gaming news

on:
  schedule:
    # كل 12 ساعة (03:30 و 15:30 UTC)
    - cron: "30 3,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch and rewrite news via Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-news.mjs

      - name: Commit and push if news changed
        run: |
          if git diff --quiet src/data/news.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "plixfy-news-bot"
          git config user.email "bot@plixfy.com"
          git add src/data/news.json
          git commit -m "chore(news): auto-update gaming news"
          git push
