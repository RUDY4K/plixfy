name: Plixfy Fast Social News

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate current official feeds without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: plixfy-fast-social-news
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore fast-news delivery state
        uses: actions/cache/restore@v6
        with:
          path: .social/fast-news-state.json
          key: fast-social-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fast-social-state-
      - name: Recover durable fast-news state after a cache miss
        if: ${{ hashFiles('.social/fast-news-state.json') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=fast-news-state&per_page=1" --jq '.artifacts[0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/fast-news-state.zip
            rm -rf /tmp/fast-news-state-artifact
            mkdir -p /tmp/fast-news-state-artifact
            unzip -q -o /tmp/fast-news-state.zip -d /tmp/fast-news-state-artifact
            node scripts/recover-fast-news-state.mjs /tmp/fast-news-state-artifact .social/fast-news-state.json
          fi
      - name: Validate fast-news boundaries
        run: node --test scripts/fast-social-news.test.mjs
      - name: Watch official sources and queue one original-content brief
        id: fast-news
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            node scripts/fast-social-news.mjs --dry-run --live-read
          else
            node scripts/fast-social-news.mjs
          fi
      - name: Save bounded failed-attempt state
        if: ${{ always() && steps.fast-news.outcome == 'failure' && steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .social/fast-news-state.json
          key: fast-social-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve bounded failed-attempt state
        if: ${{ always() && steps.fast-news.outcome == 'failure' && steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-news-state
          path: .social/fast-news-state.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Upload original-content brief
        id: brief_artifact
        if: ${{ steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: original-content-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: .social/*-original-content-brief.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Alert admin that a brief is ready for human review
        id: brief_alert
        if: ${{ steps.fast-news.outputs.state_changed == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MESSAGE: >-
            📝 رُصد خبر رسمي جديد وأُعد موجز بحث لـX. لا يوجد نشر آلي.
            أضف رأي Plixfy الأصلي وتحقق من الحقوق ثم انشر يدويًا من حساب Plixfy:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/telegram-alert.mjs
      - name: Save queued-story state after brief delivery
        if: ${{ steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .social/fast-news-state.json
          key: fast-social-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve durable idempotency state
        if: ${{ always() && steps.fast-news.outputs.state_changed == 'true' && steps.brief_artifact.outcome == 'success' && steps.brief_alert.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-news-state
          path: .social/fast-news-state.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Alert admin on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MESSAGE: >-
            🚨 تعطل مسار أخبار Plixfy السريعة. راجع التشغيل:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/telegram-alert.mjs
