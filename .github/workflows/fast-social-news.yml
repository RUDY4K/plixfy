name: Plixfy Fast Social News

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate current official feeds without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: plixfy-fast-social-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore fast-news delivery state
        uses: actions/cache/restore@v6
        with:
          path: |
            .social/fast-news-state.json
            scripts/.social-published.json
          key: fast-social-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fast-social-state-
      - name: Recover durable fast-news state after a cache miss
        if: ${{ hashFiles('.social/fast-news-state.json') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=fast-news-state&per_page=1" --jq '.artifacts[0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/fast-news-state.zip
            unzip -o /tmp/fast-news-state.zip
          fi
      - name: Validate fast-news boundaries
        run: node --test scripts/fast-social-news.test.mjs
      - name: Watch official sources and publish one fresh story
        id: fast-news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SOCIAL_PLATFORMS: telegram,discord,x,facebook
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            node scripts/fast-social-news.mjs --dry-run --live-read
          else
            node scripts/fast-social-news.mjs
          fi
      - name: Save fast-news delivery state
        if: ${{ always() && steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .social/fast-news-state.json
            scripts/.social-published.json
          key: fast-social-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve durable idempotency state
        if: ${{ always() && steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-news-state
          path: |
            .social/fast-news-state.json
            scripts/.social-published.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Upload fast-news receipts
        if: ${{ always() && steps.fast-news.outputs.state_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-social-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: .social/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Alert admin on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MESSAGE: >-
            🚨 تعطل مسار أخبار Plixfy السريعة. راجع التشغيل:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/telegram-alert.mjs
